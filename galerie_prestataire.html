<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Ndoket — Galerie prestataire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5FAFC;
    --surface:#FFFFFF;
    --ink:#1F2A33;
    --ink-soft:#54646F;
    --muted:#8B98A1;
    --orange:#F2871E;
    --orange-dark:#D66A0C;
    --orange-light:#FDE3C5;
    --blue:#3FC2E8;
    --blue-dark:#1E9BC2;
    --blue-light:#D6F3FB;
    --line:#E5EEF1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#EDEFF0;
    font-family:'Inter',sans-serif;
    padding:48px 16px;
    display:flex;
    justify-content:center;
  }

  .phone{
    width:375px;
    height:812px;
    background:var(--surface);
    border-radius:44px;
    border:12px solid var(--ink);
    overflow:hidden;
    position:relative;
    box-shadow: 0 30px 60px -25px rgba(31,42,51,0.4);
  }
  .notch{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:150px; height:26px;
    background:var(--ink);
    border-radius:0 0 16px 16px;
    z-index:8;
  }
  .screen{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .topbar{
    padding:52px 20px 12px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .back{
    width:34px;height:34px;
    border-radius:11px;
    background:var(--bg);
    border:2px solid var(--line);
    position:relative;
    flex-shrink:0;
  }
  .back::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:8px;height:8px;
    border-left:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:translate(-60%,-50%) rotate(45deg);
  }
  .topbar-title{
    font-family:'Baloo 2',sans-serif;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
  }
  .topbar-sub{
    font-size:10.5px;
    color:var(--muted);
    font-weight:600;
  }

  .content{
    flex:1;
    overflow-y:auto;
    padding:8px 20px 20px;
  }

  .cat-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:6px 0 16px;
  }
  .cat-chip{
    flex-shrink:0;
    font-size:11.5px;
    font-weight:700;
    padding:8px 14px;
    border-radius:20px;
    background:var(--bg);
    border:2px solid var(--line);
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .cat-chip.active{
    background:var(--orange);
    border-color:var(--orange);
    color:#fff;
  }

  .photo-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:6px;
  }
  .photo-tile{
    aspect-ratio:1/1;
    border-radius:12px;
    position:relative;
    overflow:hidden;
  }
  .photo-tile.big{
    grid-column:span 2;
    grid-row:span 2;
    border-radius:16px;
  }
  .g1{ background:linear-gradient(135deg, #FDE3C5, #F2871E 140%); }
  .g2{ background:linear-gradient(135deg, #D6F3FB, #3FC2E8 140%); }
  .g3{ background:linear-gradient(135deg, #F2871E, #1E9BC2 140%); }
  .g4{ background:linear-gradient(135deg, #3FC2E8, #FDE3C5 140%); }
  .g5{ background:linear-gradient(135deg, #D66A0C, #D6F3FB 140%); }
  .g6{ background:linear-gradient(135deg, #FDE3C5, #1E9BC2 140%); }
  .g7{ background:linear-gradient(135deg, #D6F3FB, #D66A0C 140%); }

  .photo-tile .like{
    position:absolute;
    bottom:8px; right:8px;
    background:rgba(31,42,51,0.55);
    color:#fff;
    font-size:9.5px;
    font-weight:700;
    padding:3px 7px;
    border-radius:8px;
    display:flex;
    align-items:center;
    gap:3px;
  }
  .photo-tile .like::before{
    content:"";
    width:8px;height:8px;
    background:#fff;
    clip-path: path('M4 7.5 C 1 5, 0 3, 2 1.6 C 3 0.8 4 1.2 4 2.4 C 4 1.2 5 0.8 6 1.6 C 8 3, 7 5, 4 7.5 Z');
  }

  .empty-hint{
    text-align:center;
    padding:40px 20px;
    color:var(--muted);
    font-size:12px;
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">

      <div class="topbar">
        <div class="back"></div>
        <div>
          <div class="topbar-title">Galerie de Fatou Tresses</div>
          <div class="topbar-sub">24 photos</div>
        </div>
      </div>

      <div class="content">
        <div class="cat-row">
          <div class="cat-chip active">Toutes</div>
          <div class="cat-chip">Box braids</div>
          <div class="cat-chip">Vanilles</div>
          <div class="cat-chip">Nattes collées</div>
          <div class="cat-chip">Avant / après</div>
        </div>

        <div class="photo-grid">
          <div class="photo-tile big g1"><div class="like">★ 24</div></div>
          <div class="photo-tile g2"></div>
          <div class="photo-tile g3"><div class="like">★ 12</div></div>
          <div class="photo-tile g4"></div>
          <div class="photo-tile g5"></div>
          <div class="photo-tile g6"><div class="like">★ 8</div></div>
          <div class="photo-tile g7"></div>
          <div class="photo-tile g2"></div>
          <div class="photo-tile g1"></div>
          <div class="photo-tile g4"><div class="like">★ 15</div></div>
          <div class="photo-tile g3"></div>
          <div class="photo-tile g5"></div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
