<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ndoket — Fiche prestataire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="animations.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F5FAFC;
    --surface:#FFFFFF;
    --ink:#1F2A33;
    --ink-soft:#54646F;
    --muted:#8B98A1;
    --orange:#F2871E;
    --orange-dark:#D66A0C;
    --orange-light:#FDE3C5;
    --blue:#3FC2E8;
    --blue-dark:#1E9BC2;
    --blue-light:#D6F3FB;
    --line:#E5EEF1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#EDEFF0;
    font-family:'Inter',sans-serif;
    padding:48px 16px;
    display:flex;
    justify-content:center;
  }

  .phone{
    width:375px;
    height:812px;
    background:var(--surface);
    border-radius:44px;
    border:12px solid var(--ink);
    overflow:hidden;
    position:relative;
    box-shadow: 0 30px 60px -25px rgba(31,42,51,0.4);
  }
  .notch{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:150px; height:26px;
    background:var(--ink);
    border-radius:0 0 16px 16px;
    z-index:8;
  }
  .screen{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .content{
    flex:1;
    overflow-y:auto;
  }

  /* Cover */
  .cover{
    height:190px;
    background:linear-gradient(135deg, var(--blue-light), var(--orange-light) 140%);
    position:relative;
  }
  .cover-top{
    position:absolute;
    top:52px; left:20px; right:20px;
    display:flex;
    justify-content:space-between;
  }
  .icon-btn{
    width:34px;height:34px;
    border-radius:11px;
    background:rgba(255,255,255,0.85);
    position:relative;
  }
  .icon-btn
  .icon-btn.heart::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:14px;height:14px;
    transform:translate(-50%,-50%);
    background:var(--orange);
    clip-path: path('M7 13 C 2 9, 0 5, 3.2 2.6 C 5 1.2 7 2 7 4 C 7 2 9 1.2 10.8 2.6 C 14 5 12 9 7 13 Z');
  }

  /* Carte profil superposée */
  .profile-card{
    margin:-34px 20px 0;
    background:var(--surface);
    border-radius:20px;
    padding:16px 16px 14px;
    box-shadow:0 12px 24px -14px rgba(31,42,51,0.3);
    position:relative;
    z-index:2;
  }
  .badge-row{
    display:flex;
    gap:6px;
    margin-bottom:8px;
  }
  .type-badge{
    font-size:9.5px;
    font-weight:800;
    padding:3px 9px;
    border-radius:8px;
    white-space:nowrap;
  }
  .type-badge.salon{ background:var(--blue-light); color:var(--blue-dark); }
  .type-badge.freelance{ background:var(--orange-light); color:var(--orange-dark); }

  .profile-name{
    font-family:'Baloo 2',sans-serif;
    font-size:19px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:4px;
  }
  .profile-meta{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .profile-meta .rating{
    color:var(--orange-dark);
    font-weight:700;
  }
  .profile-address{
    font-size:11.5px;
    color:var(--muted);
  }

  /* Tabs */
  .tabs{
    display:flex;
    gap:22px;
    padding:18px 20px 0;
    border-bottom:2px solid var(--line);
  }
  .tab{
    font-size:13px;
    font-weight:700;
    color:var(--muted);
    padding-bottom:12px;
  }
  .tab.active{
    color:var(--ink);
    border-bottom:3px solid var(--orange);
  }

  /* Services */
  .services{
    padding:16px 20px 8px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .service-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    border:2px solid var(--line);
    border-radius:16px;
    padding:14px;
  }
  .service-row.selected{
    border-color:var(--orange);
    background:var(--orange-light);
  }
  .service-info h4{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 4px;
  }
  .service-info .service-meta{
    font-size:11px;
    color:var(--muted);
  }
  .service-price{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .price-val{
    font-size:13px;
    font-weight:800;
    color:var(--ink);
  }
  .radio{
    width:20px;height:20px;
    border-radius:50%;
    border:2px solid var(--line);
    flex-shrink:0;
  }
  .radio.checked{
    border-color:var(--orange);
    background:var(--orange);
    position:relative;
  }
  .radio.checked::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:7px;height:4px;
    border-left:2px solid #fff;
    border-bottom:2px solid #fff;
    transform:translate(-50%,-60%) rotate(-45deg);
  }

  .mode-note{
    margin:10px 20px 4px;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--blue-light);
    border-radius:12px;
    padding:10px 12px;
  }
  .mode-note .dot{
    width:8px;height:8px;
    border-radius:50%;
    background:var(--blue-dark);
    flex-shrink:0;
  }
  .mode-note p{
    margin:0;
    font-size:11px;
    color:var(--blue-dark);
    font-weight:600;
    line-height:1.4;
  }

  /* Avis */
  .reviews{
    padding:18px 20px 8px;
  }
  .rating-summary{
    display:flex;
    gap:20px;
    align-items:center;
    padding-bottom:18px;
    margin-bottom:18px;
    border-bottom:2px solid var(--line);
  }
  .rating-big{
    text-align:center;
    flex-shrink:0;
  }
  .rating-big .num{
    font-family:'Baloo 2',sans-serif;
    font-size:34px;
    font-weight:800;
    color:var(--ink);
    line-height:1;
  }
  .rating-big .stars{
    color:var(--orange-dark);
    font-size:12px;
    margin:4px 0 2px;
  }
  .rating-big .count{
    font-size:10px;
    color:var(--muted);
    font-weight:600;
  }
  .rating-bars{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:5px;
  }
  .rating-bar-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .rating-bar-row .lbl{
    font-size:10px;
    color:var(--muted);
    font-weight:700;
    width:10px;
  }
  .rating-bar-track{
    flex:1;
    height:6px;
    border-radius:6px;
    background:var(--line);
    overflow:hidden;
  }
  .rating-bar-fill{
    height:100%;
    background:var(--orange);
    border-radius:6px;
  }

  .tag-filter-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:14px;
  }
  .tag-filter{
    flex-shrink:0;
    font-size:11px;
    font-weight:700;
    padding:7px 13px;
    border-radius:20px;
    background:var(--bg);
    border:2px solid var(--line);
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .tag-filter.active{
    background:var(--orange);
    border-color:var(--orange);
    color:#fff;
  }

  .review-item{
    padding:14px 0;
    border-bottom:1px solid var(--line);
  }
  .review-item:last-child{
    border-bottom:none;
  }
  .review-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:8px;
  }
  .review-avatar{
    width:36px;height:36px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--blue-light), var(--orange-light) 140%);
    flex-shrink:0;
  }
  .review-name{
    font-size:12.5px;
    font-weight:700;
    color:var(--ink);
  }
  .review-meta{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:10px;
    color:var(--muted);
    margin-top:1px;
  }
  .review-meta .stars{
    color:var(--orange-dark);
    font-weight:700;
  }
  .review-text{
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.55;
  }
  .review-service{
    display:inline-block;
    margin-top:8px;
    font-size:10px;
    font-weight:700;
    color:var(--blue-dark);
    background:var(--blue-light);
    padding:3px 9px;
    border-radius:8px;
  }

  /* Footer réservation */
  .footer{
    padding:14px 20px 24px;
    border-top:2px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .footer-total .label{
    font-size:10.5px;
    color:var(--muted);
    font-weight:600;
  }
  .footer-total .amount{
    font-family:'Baloo 2',sans-serif;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
  }
  .btn-primary{
    flex:1;
    background:var(--orange);
    color:#fff;
    text-align:right;
    padding:15px;
    border-radius:16px;
    font-weight:700;
    font-size:13.5px;
    max-width:190px;
  }

  .list-empty{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    padding:30px 16px;
  }

  /* === NDOKET : plein ecran (phone only) === */
  html,body{height:100%;}
  body{padding:0 !important;display:block !important;justify-content:flex-start !important;}
  .phone{width:100% !important;height:100% !important;max-width:none !important;
    border-radius:0 !important;border:none !important;box-shadow:none !important;}
  .notch{display:none !important;}
  .screen{height:100% !important;min-height:100dvh !important;}
  .content{overflow-y:auto !important;}
</style>
</head>
<body>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="content">

        <div class="cover">
          <div class="cover-top">
            <div class="icon-btn back"></div>
          </div>
        </div>

        <div class="profile-card">
          <div class="badge-row">
            <span class="type-badge freelance">Prestataire Ndoket</span>
          </div>
          <div class="profile-name" id="proName">—</div>
          <div class="profile-meta">
            <span class="rating" id="proRating">★ 5.0</span>
            <span id="proCount">(0 avis)</span>
          </div>
          <div class="profile-address" id="proAddress">—</div>
        </div>

        <div class="tabs">
          <div class="tab" data-nav="fiche_services">Services</div>
          <div class="tab active" data-nav="fiche_avis">Avis</div>
          <div class="tab" data-nav="fiche_apropos">À propos</div>
        </div>

        <div class="reviews">

          <div class="rating-summary">
            <div class="rating-big">
              <div class="num" id="avgNum">—</div>
              <div class="stars" id="avgStars">☆☆☆☆☆</div>
              <div class="count" id="avgCount">0 avis</div>
            </div>
            <div class="rating-bars" id="ratingBars">
              <div class="rating-bar-row"><span class="lbl">5</span><div class="rating-bar-track"><div class="rating-bar-fill" style="width:0%"></div></div></div>
              <div class="rating-bar-row"><span class="lbl">4</span><div class="rating-bar-track"><div class="rating-bar-fill" style="width:0%"></div></div></div>
              <div class="rating-bar-row"><span class="lbl">3</span><div class="rating-bar-track"><div class="rating-bar-fill" style="width:0%"></div></div></div>
              <div class="rating-bar-row"><span class="lbl">2</span><div class="rating-bar-track"><div class="rating-bar-fill" style="width:0%"></div></div></div>
              <div class="rating-bar-row"><span class="lbl">1</span><div class="rating-bar-track"><div class="rating-bar-fill" style="width:0%"></div></div></div>
            </div>
          </div>

          <div id="reviewList"></div>
          <div class="list-empty" id="listEmpty" style="display:none">Aucun avis pour le moment. Soyez la première à en déposer !</div>

        </div>

      </div>

      <div class="footer">
        <div class="footer-total">
          <div class="label">Note moyenne</div>
          <div class="amount" id="footAvg">★ 5.0 / 5</div>
        </div>
        <div class="btn-primary" data-nav="fiche_services">Voir les services</div>
      </div>

    </div>
  </div>


<script src="supabase.js"></script>
<script src="icons.js"></script>
  <script src="nav.js"></script>
<script>
(function(){
  var id = ndoket.prestataireId();
  if(!id){ location.href = 'accueil_client.html'; return; }
  var list = document.getElementById('reviewList');
  var empty = document.getElementById('listEmpty');

  supabase.select('prestataires', { id: 'eq.' + id }).then(function(rows){
    if(rows && rows[0]){
      var p = rows[0];
      document.getElementById('proName').textContent = p.nom;
      document.getElementById('proRating').textContent = '★ ' + p.note_globale.toFixed(1);
      document.getElementById('proCount').textContent = '(' + p.note_count + ' avis)';
      document.getElementById('proAddress').textContent = p.adresse;
      document.title = p.nom + ' — Avis';
    }
  }).catch(function(){});

  supabase.select('avis', { prestataire_id: 'eq.' + id }).then(function(rows){
    var avis = rows || [];
    // Prénoms des clientes (RPC : uniquement si lié par une réservation, sinon « Cliente »)
    var cids = avis.map(function(a){ return a.client_id; })
      .filter(function(v, i, arr){ return v && arr.indexOf(v) === i; });
    var namesP = cids.length
      ? supabase.rpc('get_profils_brief', { p_ids: cids }).catch(function(){ return []; })
      : Promise.resolve([]);
    return namesP.then(function(cs){
      var names = {};
      (cs || []).forEach(function(c){ names[c.id] = (c.prenom || '').trim(); });

      var avatars = [
        'linear-gradient(135deg, #D6F3FB, #3FC2E8 140%)',
        'linear-gradient(135deg, #FDE3C5, #1E9BC2 140%)',
        'linear-gradient(135deg, #DCF3E2, #3AA65A 140%)',
        'linear-gradient(135deg, #FBE3E3, #E85D5D 140%)'
      ];

      avis.forEach(function(a, i){
        var stars = '★'.repeat(a.note || 0) + '☆'.repeat(5 - (a.note || 0));
        var d = a.created_at ? new Date(a.created_at) : null;
        var when = d ? ('il y a ' + Math.max(1, Math.round((Date.now() - d.getTime()) / 86400000)) + ' jour(s)') : 'récemment';
        var item = document.createElement('div');
        item.className = 'review-item';
        item.innerHTML =
          '<div class="review-head">' +
            '<div class="review-avatar" style="background:' + avatars[i % avatars.length] + '"></div>' +
            '<div>' +
              '<div class="review-name">' + esc(names[a.client_id] || 'Cliente') + '</div>' +
              '<div class="review-meta"><span class="stars">' + stars + '</span><span>· ' + when + '</span></div>' +
            '</div>' +
          '</div>' +
          '<p class="review-text">' + esc(a.commentaire || '') + '</p>';
        list.appendChild(item);
      });

      empty.style.display = avis.length ? 'none' : 'block';
      if(avis.length){
        var sum = avis.reduce(function(acc, b){ return acc + (b.note || 0); }, 0);
        var avg = (sum / avis.length);
        document.getElementById('avgNum').textContent = avg.toFixed(1);
        var fullStars = Math.round(avg);
        document.getElementById('avgStars').textContent = '★'.repeat(fullStars) + '☆'.repeat(5 - fullStars);
        document.getElementById('avgCount').textContent = avis.length + ' avis';
        document.getElementById('footAvg').textContent = '★ ' + avg.toFixed(1) + ' / 5';
        // répartition
        var bars = document.getElementById('ratingBars').querySelectorAll('.rating-bar-fill');
        for(var n = 5; n >= 1; n--){
          var cnt = avis.filter(function(a){ return a.note === n; }).length;
          bars[5 - n].style.width = Math.round(cnt / avis.length * 100) + '%';
        }
      }
    });
  }).catch(function(err){
    empty.style.display = 'block';
    empty.textContent = 'Erreur : ' + err.message;
  });
})();
</script>
</body>
</html>
