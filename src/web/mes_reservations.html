<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ndoket — Mes réservations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="animations.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F5FAFC;
    --surface:#FFFFFF;
    --ink:#1F2A33;
    --ink-soft:#54646F;
    --muted:#8B98A1;
    --orange:#F2871E;
    --orange-dark:#D66A0C;
    --orange-light:#FDE3C5;
    --blue:#3FC2E8;
    --blue-dark:#1E9BC2;
    --blue-light:#D6F3FB;
    --green:#3AA65A;
    --green-light:#DCF3E2;
    --line:#E5EEF1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#EDEFF0;
    font-family:'Inter',sans-serif;
    padding:48px 16px;
    display:flex;
    justify-content:center;
  }

  .phone{
    width:375px;
    height:812px;
    background:var(--surface);
    border-radius:44px;
    border:12px solid var(--ink);
    overflow:hidden;
    position:relative;
    box-shadow: 0 30px 60px -25px rgba(31,42,51,0.4);
  }
  .notch{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:150px; height:26px;
    background:var(--ink);
    border-radius:0 0 16px 16px;
    z-index:8;
  }
  .screen{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .header{
    padding:46px 20px 14px;
    background:var(--surface);
  }
  .header h1{
    font-family:'Baloo 2',sans-serif;
    font-size:21px;
    font-weight:700;
    color:var(--ink);
    margin:0;
  }

  .filter-row{
    display:flex;
    gap:8px;
    padding:0 20px 14px;
    border-bottom:2px solid var(--line);
  }
  .filter-chip{
    font-size:12px;
    font-weight:700;
    padding:8px 15px;
    border-radius:20px;
    background:var(--bg);
    border:2px solid var(--line);
    color:var(--ink-soft);
  }
  .filter-chip.active{
    background:var(--orange);
    border-color:var(--orange);
    color:#fff;
  }

  .content{
    flex:1;
    overflow-y:auto;
    padding:16px 20px 20px;
  }

  .section-label{
    font-size:11px;
    font-weight:800;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin:14px 0 10px;
  }
  .section-label:first-child{
    margin-top:0;
  }

  .booking-card{
    background:var(--surface);
    border:2px solid var(--line);
    border-radius:18px;
    padding:14px;
    margin-bottom:10px;
    display:flex;
    gap:12px;
  }
  .booking-card.upcoming{
    border-color:var(--orange-light);
    background:linear-gradient(180deg, var(--orange-light) 0%, var(--surface) 40%);
  }
  .booking-date-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:52px;
    flex-shrink:0;
    background:var(--surface);
    border-radius:12px;
    border:2px solid var(--line);
    padding:8px 0;
  }
  .booking-date-col .dow{
    font-size:9.5px;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
  }
  .booking-date-col .dom{
    font-family:'Baloo 2',sans-serif;
    font-size:17px;
    font-weight:800;
    color:var(--ink);
    line-height:1.1;
  }
  .booking-date-col .time{
    font-size:9.5px;
    font-weight:700;
    color:var(--orange-dark);
    margin-top:2px;
  }

  .booking-body{
    flex:1;
    min-width:0;
  }
  .booking-provider{
    font-size:13px;
    font-weight:700;
    color:var(--ink);
  }
  .booking-service{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:1px;
  }
  .booking-foot{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
  }
  .mode-tag{
    font-size:9px;
    font-weight:800;
    padding:3px 8px;
    border-radius:8px;
    white-space:nowrap;
  }
  .mode-tag.home{ background:var(--orange-light); color:var(--orange-dark); }
  .mode-tag.place{ background:var(--blue-light); color:var(--blue-dark); }
  .status-tag{
    font-size:9px;
    font-weight:800;
    padding:3px 8px;
    border-radius:8px;
    white-space:nowrap;
  }
  .status-tag.confirmed{ background:var(--green-light); color:var(--green); }
  .status-tag.done{ background:var(--bg); color:var(--muted); }
  .status-tag.cancelled{ background:#FBE3E3; color:#C0392B; }
  .status-tag.paid{ background:var(--green-light); color:var(--green); }
  .booking-price{
    margin-left:auto;
    font-size:11.5px;
    font-weight:800;
    color:var(--ink);
  }

  .tabbar{
    display:flex;
    justify-content:space-around;
    align-items:center;
    padding:14px 0 10px;
    background:var(--surface);
    border-top:2px solid var(--line);
  }
  .tab{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
  }
  .tab-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
  .tab-icon svg{width:20px;height:20px;}
  .tab-text{
    font-size:9px;
    font-weight:700;
    color:var(--muted);
  }
  .tab.active .tab-text{
    color:var(--orange-dark);
  }
  .icon-calendar{
    width:18px;height:18px;
    position:relative;
    border:2.4px solid var(--muted);
    border-radius:4px;
    margin-top:2px;
  }
  .icon-calendar::before{
    content:"";
    position:absolute;
    top:-5px; left:2px;
    width:2.4px; height:5px;
    background:var(--muted);
    border-radius:2px;
    box-shadow:9px 0 0 var(--muted);
  }
  .icon-calendar::after{
    content:"";
    position:absolute;
    top:3px; left:0; right:0;
    height:2px;
    background:var(--muted);
  }
  .tab.active .icon-calendar{ border-color:var(--orange); }
  .tab.active .icon-calendar::before{ background:var(--orange); box-shadow:9px 0 0 var(--orange); }
  .tab.active .icon-calendar::after{ background:var(--orange); }
  .icon-home{ width:20px;height:18px; position:relative; }
  .icon-home::before{ content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-bottom:9px solid var(--muted); }
  .icon-home::after{ content:""; position:absolute; bottom:0; left:3px; width:14px; height:9px; background:var(--muted); border-radius:0 0 2px 2px; }
  .icon-search{ width:18px;height:18px; position:relative; }
  .icon-search::before{ content:""; position:absolute; top:0; left:0; width:13px;height:13px; border:2.4px solid var(--muted); border-radius:50%; }
  .icon-search::after{ content:""; position:absolute; bottom:0; right:0; width:7px; height:2.4px; background:var(--muted); border-radius:2px; transform:rotate(45deg); }
  .icon-profile{ width:16px;height:18px; position:relative; }
  .icon-profile::before{ content:""; position:absolute; top:0; left:50%; transform:translateX(-50%); width:8px;height:8px; border-radius:50%; background:var(--muted); }
  .icon-profile::after{ content:""; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:16px;height:9px; background:var(--muted); border-radius:8px 8px 0 0; }

  .list-empty{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    padding:30px 16px;
  }

  /* === NDOKET : plein ecran (phone only) === */
  html,body{height:100%;}
  body{padding:0 !important;display:block !important;justify-content:flex-start !important;}
  .phone{width:100% !important;height:100% !important;max-width:none !important;
    border-radius:0 !important;border:none !important;box-shadow:none !important;}
  .notch{display:none !important;}
  .screen{height:100% !important;min-height:100dvh !important;}
  .content{overflow-y:auto !important;}
.topbar{padding:46px 20px 8px;display:flex;align-items:center;gap:12px;}.back{width:34px;height:34px;border-radius:11px;background:var(--bg);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}.topbar-title{font-family:"Baloo 2",sans-serif;font-size:16px;font-weight:700;color:var(--ink);}
</style>
</head>
<body>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">

      <div class="topbar">
        <div class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><polyline points="15 18 9 12 15 6"/></svg></div>
        <div class="topbar-title">Mes réservations</div>
      </div>

      <div class="filter-row">
        <div class="filter-chip active">À venir</div>
        <div class="filter-chip">Terminées</div>
        <div class="filter-chip">Annulées</div>
      </div>

      <div class="content">

        <div id="resList"></div>
        <div class="list-empty" id="listEmpty" style="display:none">Aucune réservation pour le moment. Réservez votre premier rendez-vous dès maintenant !</div>

      </div>

      <div class="tabbar">
        <div class="tab" data-nav="accueil_client">
          <span class="tab-icon">home</span>
          <div class="tab-text">Accueil</div>
        </div>
        <div class="tab" data-nav="recherche">
          <span class="tab-icon">search</span>
          <div class="tab-text">Recherche</div>
        </div>
        <div class="tab active" data-nav="mes_reservations">
          <span class="tab-icon">calendar</span>
          <div class="tab-text">RDV</div>
        </div>
        <div class="tab" data-nav="profil_client">
          <span class="tab-icon">user</span>
          <div class="tab-text">Profil</div>
        </div>
      </div>
    </div>
  </div>


<script src="supabase.js"></script>
<script src="icons.js"></script>
  <script src="nav.js"></script>
<script>
(function(){
  var me = sessionUser();
  if(!me){ location.href = 'login.html'; return; }

  var DOW = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  var MONTHS = ['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];

  var STATUS = {
    confirme: ['Confirmé', 'confirmed'],
    paye: ['Payé', 'confirmed'],
    termine: ['Terminé', 'done'],
    annule: ['Annulé', 'cancelled']
  };

  var filter = 'a_venir';
  var all = [];
  var listEl = document.getElementById('resList');
  var emptyEl = document.getElementById('listEmpty');

  document.querySelectorAll('.filter-chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      document.querySelectorAll('.filter-chip').forEach(function(c){ c.classList.remove('active'); });
      chip.classList.add('active');
      var txt = chip.textContent.trim();
      filter = txt === 'À venir' ? 'a_venir' : (txt === 'Terminées' ? 'terminees' : 'annulees');
      render();
    });
  });

  function fmt(n){ return (n || 0).toLocaleString('fr-FR') + ' F'; }

  function render(){
    listEl.innerHTML = '';
    var now = new Date();
    var filtered = all.filter(function(r){
      var d = new Date(r.date_rdv + 'T' + (r.heure_debut || '00:00'));
      if(filter === 'a_venir') return (r.statut === 'confirme' || r.statut === 'paye') && d >= now;
      if(filter === 'terminees') return r.statut === 'termine' || ((r.statut === 'confirme' || r.statut === 'paye') && d < now);
      return r.statut === 'annule';
    });

    filtered.sort(function(a, b){ return (a.date_rdv + ' ' + (a.heure_debut || '')).localeCompare(b.date_rdv + ' ' + (b.heure_debut || '')); });

    var lastLabel = '';
    filtered.forEach(function(r){
      var d = new Date(r.date_rdv + 'T00:00:00');
      var label = r.statut === 'annule' ? 'Annulées' : (filter === 'terminees' ? 'Terminées' : 'À venir');
      if(label !== lastLabel){
        lastLabel = label;
        var sec = document.createElement('div');
        sec.className = 'section-label';
        sec.textContent = label;
        listEl.appendChild(sec);
      }
      var st = STATUS[r.statut] || STATUS.confirme;
      var card = document.createElement('div');
      card.className = 'booking-card';
      card.innerHTML =
        '<div class="booking-date-col">' +
          '<span class="dow">' + DOW[d.getDay()] + '</span>' +
          '<span class="dom">' + d.getDate() + '</span>' +
          '<span class="time">' + (r.heure_debut || '').substring(0,5) + '</span>' +
        '</div>' +
        '<div class="booking-body">' +
          '<div class="booking-provider">' + esc(r.prestataire_nom || 'Prestataire') + '</div>' +
          '<div class="booking-service">' + esc(r.service_nom || 'Prestation') + '</div>' +
          '<div class="booking-foot">' +
            '<span class="mode-tag ' + (r.mode === 'a_domicile' ? 'home' : 'place') + '">' + (r.mode === 'a_domicile' ? 'À domicile' : 'Sur place') + '</span>' +
            '<span class="status-tag ' + st[1] + '">' + st[0] + '</span>' +
            '<span class="booking-price">' + fmt(r.montant_total) + '</span>' +
          '</div>' +
        '</div>';
      card.addEventListener('click', function(){
        ndoket.setBooking({ _reservation_id: r.id });
        location.href = 'rendezvous_detail.html';
      });
      listEl.appendChild(card);
    });

    emptyEl.style.display = filtered.length ? 'none' : 'block';
  }

  supabase.select('reservations', { client_id: 'eq.' + me.id }).then(function(rows){
    all = rows || [];
    var ids = all.map(function(r){ return r.prestataire_id; }).filter(function(v, i, a){ return v && a.indexOf(v) === i; });
    var sids = all.map(function(r){ return r.service_id; }).filter(function(v, i, a){ return v && a.indexOf(v) === i; });

    var p = ids.length ? supabase.select('prestataires', { id: 'in.(' + ids.join(',') + ')' }) : Promise.resolve([]);
    var s = sids.length ? supabase.select('services', { id: 'in.(' + sids.join(',') + ')' }) : Promise.resolve([]);

    Promise.all([p, s]).then(function(res){
      var pros = {}, servs = {};
      (res[0] || []).forEach(function(x){ pros[x.id] = x; });
      (res[1] || []).forEach(function(x){ servs[x.id] = x; });
      all.forEach(function(r){
        r.prestataire_nom = pros[r.prestataire_id] ? pros[r.prestataire_id].nom : 'Prestataire';
        r.service_nom = servs[r.service_id] ? servs[r.service_id].nom : 'Prestation';
      });
      render();
    });
  }).catch(function(err){
    emptyEl.style.display = 'block';
    emptyEl.textContent = 'Erreur : ' + err.message;
  });
})();
</script>
<script>document.querySelectorAll(".tab-icon").forEach(function(el){var n=el.textContent;el.innerHTML=icon(n);el.style.display="flex";el.style.alignItems="center";el.style.justifyContent="center";});</script>
</body>
</html>
