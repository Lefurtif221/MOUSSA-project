<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ndoket — Sur place ou à domicile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="animations.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F5FAFC;
    --surface:#FFFFFF;
    --ink:#1F2A33;
    --ink-soft:#54646F;
    --muted:#8B98A1;
    --orange:#F2871E;
    --orange-dark:#D66A0C;
    --orange-light:#FDE3C5;
    --blue:#3FC2E8;
    --blue-dark:#1E9BC2;
    --blue-light:#D6F3FB;
    --line:#E5EEF1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#EDEFF0;
    font-family:'Inter',sans-serif;
    padding:48px 16px;
    display:flex;
    justify-content:center;
  }

  .phone{
    width:375px;
    height:812px;
    background:var(--surface);
    border-radius:44px;
    border:12px solid var(--ink);
    overflow:hidden;
    position:relative;
    box-shadow: 0 30px 60px -25px rgba(31,42,51,0.4);
  }
  .notch{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:150px; height:26px;
    background:var(--ink);
    border-radius:0 0 16px 16px;
    z-index:8;
  }
  .screen{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .topbar{
    padding:52px 20px 8px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .back{
    width:34px;height:34px;
    border-radius:11px;
    background:var(--bg);
    border:2px solid var(--line);
    position:relative;
    flex-shrink:0;
  display:flex;align-items:center;justify-content:center;}
  
  .steps{
    display:flex;
    gap:6px;
    flex:1;
  }
  .step-bar{
    height:4px;
    flex:1;
    border-radius:4px;
    background:var(--line);
  }
  .step-bar.done{
    background:var(--orange);
  }

  .body{
    flex:1;
    overflow-y:auto;
    padding:22px 24px 24px;
  }

  .eyebrow{
    font-size:11.5px;
    font-weight:800;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--orange-dark);
    margin-bottom:8px;
  }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-size:22px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 8px;
  }
  .subtitle{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.55;
    margin:0 0 24px;
  }

  .summary-chip{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--bg);
    border-radius:14px;
    padding:10px 14px;
    margin-bottom:26px;
  }
  .summary-chip .avatar{
    width:34px;height:34px;
    border-radius:10px;
    background:linear-gradient(135deg, var(--blue-light), var(--orange-light) 140%);
    flex-shrink:0;
  }
  .summary-chip .txt .name{
    font-size:12.5px;
    font-weight:700;
    color:var(--ink);
  }
  .summary-chip .txt .service{
    font-size:11px;
    color:var(--muted);
  }

  .option-card{
    border:2px solid var(--line);
    border-radius:20px;
    padding:18px;
    margin-bottom:16px;
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .option-card.selected{
    border-color:var(--blue);
    background:var(--blue-light);
  }
  .option-icon{
    width:48px;height:48px;
    border-radius:14px;
    background:var(--surface);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .option-icon .shape{
    width:20px;height:20px;
    border-radius:50%;
    background:var(--blue-dark);
  }
  .option-card:last-of-type .option-icon .shape{
    background:var(--orange-dark);
    border-radius:5px;
  }
  .option-text{
    flex:1;
  }
  .option-text h3{
    font-family:'Baloo 2',sans-serif;
    font-size:15.5px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 4px;
  }
  .option-text p{
    font-size:11.5px;
    color:var(--ink-soft);
    line-height:1.5;
    margin:0 0 6px;
  }
  .option-extra{
    font-size:10.5px;
    font-weight:700;
    color:var(--blue-dark);
  }
  .option-card:last-of-type .option-extra{
    color:var(--orange-dark);
  }
  .radio{
    width:20px;height:20px;
    border-radius:50%;
    border:2px solid var(--line);
    flex-shrink:0;
    background:var(--surface);
  }
  .radio.checked{
    border-color:var(--blue-dark);
    background:var(--blue-dark);
    position:relative;
  }
  .radio.checked::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:7px;height:4px;
    border-left:2px solid #fff;
    border-bottom:2px solid #fff;
    transform:translate(-50%,-60%) rotate(-45deg);
  }

  .address-field{
    margin-top:4px;
    margin-bottom:8px;
  }
  .address-field .field-label{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:7px;
  }
  .address-field .field-input{
    border:2px solid var(--line);
    border-radius:14px;
    padding:13px 15px;
    background:var(--surface);
    font-size:13px;
    color:var(--muted);
  }

  .footer{display:flex;justify-content:center;align-items:center;
    padding:16px 20px 26px;
    border-top:2px solid var(--line);
  }
  .btn-primary{
    min-width:230px;
    background:var(--orange);
    color:#FFFFFF;
    border:none;
    text-align:center;
    padding:14px 40px;
    border-radius:16px;
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:14.5px;
    cursor:pointer;
  }

  /* === NDOKET : plein ecran (phone only) === */
  html,body{height:100%;}
  body{padding:0 !important;display:block !important;justify-content:flex-start !important;}
  .phone{width:100% !important;height:100% !important;max-width:none !important;
    border-radius:0 !important;border:none !important;box-shadow:none !important;}
  .notch{display:none !important;}
  .screen{height:100% !important;min-height:100dvh !important;}
  .content{overflow-y:auto !important;}
</style>
</head>
<body>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">

      <div class="topbar">
        <div class="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><polyline points="15 18 9 12 15 6"/></svg></div>
        <div class="steps">
          <div class="step-bar done"></div>
          <div class="step-bar"></div>
          <div class="step-bar"></div>
          <div class="step-bar"></div>
        </div>
      </div>

      <div class="body">
        <div class="eyebrow">Étape 2 sur 4</div>
        <h1>Où souhaitez-vous être servie ?</h1>
        <p class="subtitle" id="proSubtitle">Choisissez votre mode de prestation.</p>

        <div class="summary-chip">
          <div class="avatar"></div>
          <div class="txt">
            <div class="name" id="proName">—</div>
            <div class="service" id="serviceName">—</div>
          </div>
        </div>

        <div class="option-card selected" id="optPlace">
          <div class="option-icon"><div class="shape"></div></div>
          <div class="option-text">
            <h3>Sur place</h3>
            <p>Vous vous rendez chez la prestataire.</p>
            <div class="option-extra">Aucun frais supplémentaire</div>
          </div>
          <div class="radio checked"></div>
        </div>

        <div class="option-card" id="optHome">
          <div class="option-icon"><div class="shape"></div></div>
          <div class="option-text">
            <h3>À domicile</h3>
            <p>La prestataire se déplace chez vous, dans un rayon de 5 km.</p>
            <div class="option-extra" id="homeFeeExtra">Déplacement gratuit</div>
          </div>
          <div class="radio"></div>
        </div>

        <div class="address-field" id="addressField" style="display:none">
          <div class="field-label">Votre adresse (si à domicile)</div>
          <input type="text" class="field-input" id="addressInput" placeholder="Quartier, rue, point de repère..." />
        </div>
      </div>

      <div class="footer">
        <button type="button" class="btn-primary" id="continueBtn">Continuer</button>
      </div>

    </div>
  </div>


<script src="supabase.js"></script>
<script src="icons.js"></script>
  <script src="nav.js"></script>
<script>
(function(){
  var booking = ndoket.getBooking();
  if(!booking.service_id){ location.href = 'fiche_services.html'; return; }

  var mode = 'sur_place';

  document.getElementById('serviceName').textContent = booking.service_nom +
    (booking.montant ? ' · ' + booking.montant.toLocaleString('fr-FR') + ' FCFA' : '');

  var modePid = booking.prestataire_id || ndoket.prestataireId();
  if(modePid){
    supabase.select('prestataires', { id: 'eq.' + modePid }).then(function(rows){
      if(rows && rows[0]){
        document.getElementById('proName').textContent = rows[0].nom;
        document.getElementById('proSubtitle').textContent = rows[0].nom + ' propose ses services sur place et à domicile.';
        var frais = parseInt(rows[0].frais_deplacement, 10) || 0;
        ndoket.set('frais', frais);
        document.getElementById('homeFeeExtra').textContent = frais > 0
          ? '+ ' + frais.toLocaleString('fr-FR') + ' FCFA de déplacement'
          : 'Déplacement gratuit';
      }
    }).catch(function(){});
  }

  // Lire mode_prestation et supplement_domicile du service choisi
  if(booking.service_id){
    supabase.select('services', { id: 'eq.' + booking.service_id }).then(function(rows){
      if(rows && rows[0]){
        var svc = rows[0];
        var mp = svc.mode_prestation || 'les_deux';
        // Masquer l'option non supportée
        if(mp === 'sur_place'){
          document.getElementById('optHome').style.display = 'none';
          select('sur_place');
        } else if(mp === 'a_domicile'){
          document.getElementById('optPlace').style.display = 'none';
          select('a_domicile');
          fillAddrFromGps();
        }
        // Ajouter le supplément domicile du service au frais total
        var suppDom = parseInt(svc.supplement_domicile, 10) || 0;
        if(suppDom > 0){
          var baseFrais = parseInt(ndoket.get('frais', 0), 10) || 0;
          var totalFrais = baseFrais + suppDom;
          ndoket.set('frais', totalFrais);
          document.getElementById('homeFeeExtra').textContent = '+ ' + totalFrais.toLocaleString('fr-FR') + ' FCFA de déplacement';
        }
      }
    }).catch(function(){});
  }

  function select(which){
    mode = which;
    document.getElementById('optPlace').classList.toggle('selected', which === 'sur_place');
    document.getElementById('optHome').classList.toggle('selected', which === 'a_domicile');
    document.getElementById('optPlace').querySelector('.radio').classList.toggle('checked', which === 'sur_place');
    document.getElementById('optHome').querySelector('.radio').classList.toggle('checked', which === 'a_domicile');
    document.getElementById('addressField').style.display = which === 'a_domicile' ? 'block' : 'none';
  }

  document.getElementById('optPlace').addEventListener('click', function(){ select('sur_place'); });
  document.getElementById('optHome').addEventListener('click', function(){ select('a_domicile'); fillAddrFromGps(); });

  // Adresse remplie automatiquement depuis la position du client + suggestions
  var addrInput = document.getElementById('addressInput');
  var addrFilled = false;
  function fillAddrFromGps(){
    if(addrFilled) return;
    addrFilled = true;
    getMyPosition(10000).then(function(pos){
      geoReverse(pos.latitude, pos.longitude).then(function(a){
        if(!addrInput.value.trim()){ addrInput.value = a; }
      }).catch(function(){});
    }).catch(function(){});
  }
  attachAddressAutocomplete(addrInput, function(){});
  fillAddrFromGps();

  document.getElementById('continueBtn').addEventListener('click', function(){
    if(mode === 'a_domicile'){
      var addr = document.getElementById('addressInput').value.trim();
      if(!addr){
        document.getElementById('addressInput').style.borderColor = '#C0392B';
        return;
      }
      ndoket.setBooking({ mode: mode, adresse_domicile: addr });
    } else {
      ndoket.setBooking({ mode: mode, adresse_domicile: '' });
    }
    location.href = 'choix_creneau.html';
  });
})();
</script>
</body>
</html>
