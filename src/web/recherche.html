<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ndoket - Recherche</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="animations.css">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5FAFC;--surface:#FFFFFF;--ink:#1F2A33;--ink-soft:#54646F;--muted:#8B98A1;
    --orange:#F2871E;--orange-dark:#D66A0C;--orange-light:#FDE3C5;
    --blue:#3FC2E8;--blue-dark:#1E9BC2;--blue-light:#D6F3FB;
    --green:#3AA65A;--green-light:#DCF3E2;--line:#E5EEF1;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;}
  .screen{width:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

  .topbar{padding:50px 20px 8px;display:flex;align-items:center;gap:12px;}
  .topbar-title{font-family:'Baloo 2',sans-serif;font-size:16px;font-weight:700;color:var(--ink);}
  .back{width:34px;height:34px;border-radius:11px;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;}

  .search-big{padding:0 20px;margin-top:8px;}
  .search-wrap{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;}
  .search-wrap svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex-shrink:0;}
  .search-wrap input{flex:1;border:none;outline:none;font-size:13px;font-family:'Inter',sans-serif;color:var(--ink);background:transparent;}
  .search-wrap input::placeholder{color:var(--muted);}

  .strip{height:5px;background:repeating-linear-gradient(90deg,var(--orange) 0 12px,#fff 12px 17px,var(--blue) 17px 22px,#fff 22px 27px);}

  .content{flex:1;overflow-y:auto;padding-bottom:80px;}

  .section-title{font-family:'Baloo 2',sans-serif;font-size:14px;font-weight:700;color:var(--ink);padding:16px 20px 8px;}
  .cats{display:flex;gap:8px;padding:0 20px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .cats::-webkit-scrollbar{display:none;}
  .cat{flex-shrink:0;font-size:11.5px;font-weight:700;padding:8px 14px;border-radius:20px;background:var(--surface);border:2px solid var(--line);color:var(--ink-soft);cursor:pointer;transition:all 0.2s;}
  .cat.active{background:var(--blue);border-color:var(--blue);color:#fff;}

  .results{padding:0 20px;display:flex;flex-direction:column;gap:12px;}
  .prov-card{background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform 0.15s;}
  .prov-card:active{transform:scale(0.98);}
  .prov-photo{height:80px;}
  .prov-body{padding:12px 14px;}
  .prov-name{font-family:'Baloo 2',sans-serif;font-size:15px;font-weight:700;color:var(--ink);}
  .prov-addr{font-size:11px;color:var(--muted);margin-top:2px;}
  .prov-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .prov-note{font-size:11px;font-weight:700;color:var(--orange-dark);}
  .prov-price{font-family:'Baloo 2',sans-serif;font-size:13px;font-weight:800;color:var(--blue-dark);}

  .empty{text-align:center;padding:40px 20px;font-size:13px;color:var(--muted);}
  .empty svg{width:48px;height:48px;stroke:var(--line);fill:none;stroke-width:1.5;margin-bottom:12px;}

  .tabbar{display:flex;justify-content:space-around;padding:12px 0 10px;background:var(--surface);border-top:2px solid var(--line);position:fixed;bottom:0;left:0;right:0;}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .tab-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
  .tab-icon svg{width:20px;height:20px;}
  .tab-text{font-size:9px;font-weight:700;color:var(--muted);}
  .tab.active .tab-text{color:var(--orange-dark);}
</style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <div class="topbar-title">Recherche</div>
    </div>

    <div class="search-big">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Nom, service, adresse..." autofocus />
      </div>
    </div>
    <div class="strip"></div>

    <div class="content">
      <div class="section-title">Catégories</div>
      <div class="cats" id="catRow">
        <div class="cat active" data-cat="Tous">Tous</div>
        <div class="cat" data-cat="Pose d'ongles">Pose d'ongles</div>
        <div class="cat" data-cat="Pose de cils">Pose de cils</div>
        <div class="cat" data-cat="Coiffure">Coiffure</div>
              </div>

      <div id="resultList" class="results"></div>
      <div class="empty" id="emptyState" style="display:none">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <div>Recherchez un prestataire ou un service</div>
      </div>
    </div>

    <div class="tabbar">
      <div class="tab" data-nav="accueil_client">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <div class="tab-text">Accueil</div>
      </div>
      <div class="tab active" data-nav="recherche">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <div class="tab-text">Recherche</div>
      </div>
      <div class="tab" data-nav="mes_reservations">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
        <div class="tab-text">RDV</div>
      </div>
      <div class="tab" data-nav="profil_client">
        <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
        <div class="tab-text">Profil</div>
      </div>
    </div>
  </div>

<script src="supabase.js"></script>
<script src="nav.js"></script>
<script>
(function(){
  var list = document.getElementById('resultList');
  var empty = document.getElementById('emptyState');
  var search = document.getElementById('searchInput');
  var state = { cat:'Tous', query:'' };
  var providers = [];
  var myPos = null;

  function distKm(a, b, c, d){
    var R = 6371, toRad = Math.PI / 180;
    var dLat = (c - a) * toRad, dLng = (d - b) * toRad;
    var x = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(a*toRad)*Math.cos(c*toRad)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
  }
  function fmtDist(km){
    if(km == null) return '';
    return 'À ' + (km < 10 ? km.toFixed(1) : Math.round(km)) + ' km';
  }

  // Position du client pour les distances
  (function(){
    var u = sessionUser();
    if(!u){ getMyPosition().then(function(pos){ myPos = pos; render(); }).catch(function(){}); return; }
    supabase.select('profils', { id: 'eq.' + u.id }).then(function(rows){
      var p = rows && rows[0];
      if(p && p.latitude != null && p.longitude != null){
        myPos = { latitude: p.latitude, longitude: p.longitude };
        render();
      } else {
        getMyPosition().then(function(pos){
          myPos = pos;
          supabase.update('profils', { latitude: pos.latitude, longitude: pos.longitude }, 'id', u.id).catch(function(){});
          render();
        }).catch(function(){});
      }
    }).catch(function(){});
  })();
  var providers = [];

  var gradients = [
    'linear-gradient(135deg, #FDE3C5, #F2871E 140%)',
    'linear-gradient(135deg, #D6F3FB, #3FC2E8 140%)',
    'linear-gradient(135deg, #DCF3E2, #3AA65A 140%)',
    'linear-gradient(135deg, #FBE3E3, #E85D5D 140%)'
  ];

  function render(){
    var q = state.query.toLowerCase();
    if(!q && state.cat==='Tous'){
      list.innerHTML = '';
      empty.style.display = 'block';
      return;
    }

    var rows = providers.filter(function(p){
      var okCat = state.cat==='Tous' || (p.categorie||'').toLowerCase().split(',').map(function(s){return s.trim();}).indexOf(state.cat.toLowerCase())>-1 || (p.categorie||'').toLowerCase()===state.cat.toLowerCase();
      var okQ = !q || (p.nom||'').toLowerCase().indexOf(q)>-1 || (p.adresse||'').toLowerCase().indexOf(q)>-1 || (p.categorie||'').toLowerCase().indexOf(q)>-1 || (p._serviceNames||'').toLowerCase().indexOf(q)>-1;
      return okCat && okQ;
    });

    // Tri par proximité si position dispo
    rows.forEach(function(p){
      p._dist = (myPos && p.latitude != null && p.longitude != null)
        ? distKm(myPos.latitude, myPos.longitude, p.latitude, p.longitude)
        : null;
    });
    if(myPos){
      rows.sort(function(a, b){ return (a._dist == null ? 999 : a._dist) - (b._dist == null ? 999 : b._dist); });
    } else {
      rows.sort(function(a, b){ return (b.note_globale || 0) - (a.note_globale || 0); });
    }

    list.innerHTML = '';
    empty.style.display = rows.length ? 'none' : 'block';

    rows.forEach(function(p,i){
      var card = document.createElement('div');
      card.className = 'prov-card';
      var tag = (p.adresse || (p.ville||'Dakar')+', Dakar') + (fmtDist(p._dist) ? ' · ' + fmtDist(p._dist) : '');
      var price = p.prix_min ? ('Dès '+p.prix_min.toLocaleString('fr-FR')+' F') : '';
      var note = p.note_globale ? ('★ '+Number(p.note_globale).toFixed(1)+' ('+p.note_count+')') : '';
      card.innerHTML =
        '<div class="prov-photo" style="'+(p.photo_url ? 'background-image:url(&quot;'+escUrl(p.photo_url)+'&quot;);background-size:cover;background-position:center' : 'background:'+gradients[i%gradients.length])+'"></div>'+
        '<div class="prov-body">'+
          '<div class="prov-name">'+esc(p.nom)+'</div>'+
          '<div class="prov-addr">'+esc(tag)+'</div>'+
          '<div class="prov-foot">'+
            '<span class="prov-note">'+note+'</span>'+
            '<span class="prov-price">'+price+'</span>'+
          '</div>'+
        '</div>';
      card.onclick=function(){
        ndoket.setPrestataire(p.id);
        location.href='fiche_services.html';
      };
      list.appendChild(card);
    });
  }

  supabase.select('prestataires').then(function(rows){
    providers = rows || [];
    return supabase.select('services').then(function(services){
      var minBy = {};
      var namesBy = {};
      (services||[]).forEach(function(s){
        if(!minBy[s.prestataire_id]||s.prix<minBy[s.prestataire_id]) minBy[s.prestataire_id]=s.prix;
        namesBy[s.prestataire_id]=(namesBy[s.prestataire_id]||'')+' '+(s.nom||'');
      });
      providers.forEach(function(p){ p.prix_min=minBy[p.id]||0; p._serviceNames=namesBy[p.id]||''; });
      render();
    });
  }).catch(function(e){
    empty.style.display='block';
    empty.textContent='Erreur : '+e.message;
  });

  search.addEventListener('input',function(){ state.query=search.value.trim(); render(); });

  document.getElementById('catRow').addEventListener('click',function(e){
    var item=e.target.closest('.cat');
    if(!item) return;
    document.querySelectorAll('.cat').forEach(function(c){c.classList.remove('active');});
    item.classList.add('active');
    state.cat=item.getAttribute('data-cat');
    render();
  });
})();
</script>
</body>
</html>
