<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Ndoket — Choix du créneau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5FAFC;
    --surface:#FFFFFF;
    --ink:#1F2A33;
    --ink-soft:#54646F;
    --muted:#8B98A1;
    --orange:#F2871E;
    --orange-dark:#D66A0C;
    --orange-light:#FDE3C5;
    --blue:#3FC2E8;
    --blue-dark:#1E9BC2;
    --blue-light:#D6F3FB;
    --line:#E5EEF1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#EDEFF0;
    font-family:'Inter',sans-serif;
    padding:48px 16px;
    display:flex;
    justify-content:center;
  }

  .phone{
    width:375px;
    height:812px;
    background:var(--surface);
    border-radius:44px;
    border:12px solid var(--ink);
    overflow:hidden;
    position:relative;
    box-shadow: 0 30px 60px -25px rgba(31,42,51,0.4);
  }
  .notch{
    position:absolute;
    top:0; left:50%;
    transform:translateX(-50%);
    width:150px; height:26px;
    background:var(--ink);
    border-radius:0 0 16px 16px;
    z-index:8;
  }
  .screen{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  .topbar{
    padding:52px 20px 8px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .back{
    width:34px;height:34px;
    border-radius:11px;
    background:var(--bg);
    border:2px solid var(--line);
    position:relative;
    flex-shrink:0;
  }
  .back::after{
    content:"";
    position:absolute;
    top:50%; left:50%;
    width:8px;height:8px;
    border-left:2px solid var(--ink-soft);
    border-bottom:2px solid var(--ink-soft);
    transform:translate(-60%,-50%) rotate(45deg);
  }
  .steps{
    display:flex;
    gap:6px;
    flex:1;
  }
  .step-bar{
    height:4px;
    flex:1;
    border-radius:4px;
    background:var(--line);
  }
  .step-bar.done{
    background:var(--orange);
  }

  .body{
    flex:1;
    overflow-y:auto;
    padding:22px 24px 24px;
  }

  .eyebrow{
    font-size:11.5px;
    font-weight:800;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--orange-dark);
    margin-bottom:8px;
  }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-size:22px;
    font-weight:700;
    color:var(--ink);
    margin:0 0 20px;
  }

  .summary-chip{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--bg);
    border-radius:14px;
    padding:10px 14px;
    margin-bottom:24px;
  }
  .summary-chip .avatar{
    width:34px;height:34px;
    border-radius:10px;
    background:linear-gradient(135deg, var(--blue-light), var(--orange-light) 140%);
    flex-shrink:0;
  }
  .summary-chip .txt .name{
    font-size:12.5px;
    font-weight:700;
    color:var(--ink);
  }
  .summary-chip .txt .service{
    font-size:11px;
    color:var(--muted);
  }
  .summary-chip .mode-tag{
    margin-left:auto;
    font-size:9.5px;
    font-weight:800;
    color:var(--orange-dark);
    background:var(--orange-light);
    padding:4px 9px;
    border-radius:8px;
    white-space:nowrap;
  }

  .section-label{
    font-size:12px;
    font-weight:800;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.04em;
    margin-bottom:12px;
  }

  /* Sélecteur de date */
  .date-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:26px;
  }
  .date-item{
    flex-shrink:0;
    width:52px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    border:2px solid var(--line);
    border-radius:14px;
    padding:10px 0;
  }
  .date-item.selected{
    border-color:var(--orange);
    background:var(--orange);
  }
  .date-item .dow{
    font-size:10px;
    font-weight:700;
    color:var(--muted);
  }
  .date-item.selected .dow{
    color:#FFEFDB;
  }
  .date-item .dom{
    font-family:'Baloo 2',sans-serif;
    font-size:15px;
    font-weight:700;
    color:var(--ink);
  }
  .date-item.selected .dom{
    color:#fff;
  }
  .date-item.disabled{
    opacity:0.35;
  }

  /* Grille de créneaux */
  .slot-period{
    margin-bottom:18px;
  }
  .slot-period-label{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .slot-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
  }
  .slot{
    text-align:center;
    padding:11px 0;
    border-radius:12px;
    border:2px solid var(--line);
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .slot.selected{
    border-color:var(--orange);
    background:var(--orange);
    color:#fff;
  }
  .slot.unavailable{
    color:var(--muted);
    background:var(--bg);
    text-decoration:line-through;
    border-color:var(--line);
    opacity:0.55;
  }

  .footer{
    padding:16px 24px 26px;
    border-top:2px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .footer-info .label{
    font-size:10px;
    color:var(--muted);
    font-weight:600;
  }
  .footer-info .val{
    font-family:'Baloo 2',sans-serif;
    font-size:14px;
    font-weight:700;
    color:var(--ink);
  }
  .btn-primary{
    background:var(--orange);
    color:#fff;
    text-align:center;
    padding:15px 26px;
    border-radius:16px;
    font-weight:700;
    font-size:13.5px;
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">

      <div class="topbar">
        <div class="back"></div>
        <div class="steps">
          <div class="step-bar done"></div>
          <div class="step-bar done"></div>
          <div class="step-bar done"></div>
          <div class="step-bar"></div>
        </div>
      </div>

      <div class="body">
        <div class="eyebrow">Étape 4 sur 4</div>
        <h1>Choisissez un créneau</h1>

        <div class="summary-chip">
          <div class="avatar"></div>
          <div class="txt">
            <div class="name">Fatou Tresses</div>
            <div class="service">Tresses box braids</div>
          </div>
          <div class="mode-tag">À domicile</div>
        </div>

        <div class="section-label">Date</div>
        <div class="date-row">
          <div class="date-item"><span class="dow">Mer</span><span class="dom">31</span></div>
          <div class="date-item selected"><span class="dow">Ven</span><span class="dom">2</span></div>
          <div class="date-item"><span class="dow">Sam</span><span class="dom">3</span></div>
          <div class="date-item"><span class="dow">Dim</span><span class="dom">4</span></div>
          <div class="date-item disabled"><span class="dow">Lun</span><span class="dom">5</span></div>
          <div class="date-item"><span class="dow">Mar</span><span class="dom">6</span></div>
        </div>

        <div class="section-label">Créneaux disponibles — Ven. 2 août</div>

        <div class="slot-period">
          <div class="slot-period-label">Matin</div>
          <div class="slot-grid">
            <div class="slot unavailable">09:00</div>
            <div class="slot">10:00</div>
            <div class="slot">11:30</div>
          </div>
        </div>

        <div class="slot-period">
          <div class="slot-period-label">Après-midi</div>
          <div class="slot-grid">
            <div class="slot">13:00</div>
            <div class="slot selected">14:30</div>
            <div class="slot">16:00</div>
          </div>
        </div>

        <div class="slot-period">
          <div class="slot-period-label">Soir</div>
          <div class="slot-grid">
            <div class="slot">17:30</div>
            <div class="slot unavailable">18:30</div>
            <div class="slot">19:00</div>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="footer-info">
          <div class="label">Créneau choisi</div>
          <div class="val">Ven. 2 août, 14:30</div>
        </div>
        <div class="btn-primary">Continuer</div>
      </div>

    </div>
  </div>

</body>
</html>
